<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telop Studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="style-extra.css"></head><body>
<header><div class="brand"><span class="logo">T</span><div><b>Telop Studio</b><small>ブラウザでつくる透過テロップ</small></div></div><div class="header-actions"><button id="reset">初期化</button><button id="exportPreset">設定をJSON保存</button><button id="importPreset">設定をJSON読込</button><input type="file" id="presetFile" accept="application/json,.json" hidden><button id="download">現在のPNG</button><button class="primary" id="downloadAll">全件をZIP保存</button></div></header>
<main><aside class="sidebar">
 <section><h2>テロップ一覧</h2><div id="telopList"></div><div class="row list-actions"><button id="addTelop">＋ 追加</button><button id="duplicateTelop">複製</button><button id="deleteTelop">削除</button></div></section>
 <section><h2>テキスト</h2><div class="richbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><input type="color" id="partialColor" value="#ffd83d"><button id="applyColor">色</button><select id="partialFont"><option value="">選択部分のフォント</option><option value="Arial">Arial</option><option value="Hiragino Sans">ヒラギノ角ゴ</option><option value="Hiragino Mincho ProN">ヒラギノ明朝</option><option value="Impact">Impact</option></select><button id="applyFont">フォント適用</button><button id="clearFormat">解除</button></div><div id="editor" contenteditable="true" spellcheck="false">今日は<span style="color:#ffd83d;font-weight:900">福井</span>を<br>旅するのだ！</div><p class="hint">文字を選択して部分装飾。プレビュー上はダブルクリックで直接編集できます</p></section>
 <details open><summary>文字</summary><div class="controls"><label>フォント<div class="row"><select id="fontFamily"><option value='"Noto Sans JP","Hiragino Sans",sans-serif'>ゴシック</option><option value='"Hiragino Mincho ProN","Yu Mincho",serif'>明朝</option><option value='Impact,sans-serif'>Impact</option></select><button id="addFont">追加</button><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden></div></label><div class="grid2"><label>サイズ <output data-for="fontSize"></output><input id="fontSize" type="range" min="16" max="220" value="88"></label><label>不透明度 <output data-for="opacity"></output><input id="opacity" type="range" min="0" max="100" value="100"></label><label>文字間隔 <output data-for="letterSpacing"></output><input id="letterSpacing" type="range" min="-10" max="40" value="2"></label><label>行間 <output data-for="lineHeight"></output><input id="lineHeight" type="range" min="70" max="220" value="115"></label></div><div class="row wrap"><label class="check"><input id="bold" type="checkbox" checked>太字</label><label class="check"><input id="italic" type="checkbox">斜体</label><button class="align active" data-align="left">左</button><button class="align" data-align="center">中央</button><button class="align" data-align="right">右</button><label class="check"><input id="vertical" type="checkbox">縦書き</label></div><color-field label="文字色" input-id="textColor" value="#ffffff"></color-field></div></details>
 <details open><summary>二重縁取り</summary><div class="controls"><label class="check"><input id="outlineEnabled" type="checkbox" checked>縁取りを使用</label><div class="grid2"><div><color-field label="内側の色" input-id="innerColor" value="#202538"></color-field><label>内側の太さ <output data-for="innerWidth"></output><input id="innerWidth" type="range" min="0" max="30" value="9"></label></div><div><color-field label="外側の色" input-id="outerColor" value="#ffffff"></color-field><label>外側の太さ <output data-for="outerWidth"></output><input id="outerWidth" type="range" min="0" max="45" value="18"></label></div></div></div></details>
 <details><summary>影</summary><div class="controls"><label class="check"><input id="shadowEnabled" type="checkbox" checked>影を使用</label><color-field label="影の色" input-id="shadowColor" value="#000000"></color-field><div class="grid2"><label>濃さ <output data-for="shadowOpacity"></output><input id="shadowOpacity" type="range" min="0" max="100" value="65"></label><label>距離 <output data-for="shadowDistance"></output><input id="shadowDistance" type="range" min="0" max="80" value="18"></label><label>方向 <output data-for="shadowAngle"></output><input id="shadowAngle" type="range" min="0" max="359" value="45"></label><label>ぼかし <output data-for="shadowBlur"></output><input id="shadowBlur" type="range" min="0" max="50" value="8"></label></div></div></details>
 <details><summary>背景</summary><div class="controls"><label class="check"><input id="backgroundEnabled" type="checkbox">背景を使用</label><color-field label="背景色" input-id="backgroundColor" value="#111827"></color-field><div class="grid2"><label>半透明 <output data-for="backgroundOpacity"></output><input id="backgroundOpacity" type="range" min="0" max="100" value="75"></label><label>角丸 <output data-for="borderRadius"></output><input id="borderRadius" type="range" min="0" max="100" value="24"></label><label>横余白 <output data-for="paddingX"></output><input id="paddingX" type="range" min="0" max="120" value="32"></label><label>縦余白 <output data-for="paddingY"></output><input id="paddingY" type="range" min="0" max="100" value="18"></label></div></div></details>
 <details open><summary>レイアウト</summary><div class="controls"><div class="grid2"><label>最大横幅 <output data-for="maxWidth"></output><input id="maxWidth" type="range" min="200" max="1800" value="1400"></label><label>最大行数<input id="maxLines" type="number" min="1" max="10" value="3"></label><label>横位置 <output data-for="posX"></output><input id="posX" type="range" min="0" max="100" value="50"></label><label>縦位置 <output data-for="posY"></output><input id="posY" type="range" min="0" max="100" value="82"></label></div><div class="row wrap"><button id="youtubePosition">画面中央・下（YouTube）</button><label class="check"><input id="autoWrap" type="checkbox" checked>自動改行</label><label class="check"><input id="autoFit" type="checkbox" checked>自動フィット</label><label class="check"><input id="safeArea" type="checkbox" checked>縦動画セーフエリア</label></div></div></details>
 <details><summary>顔アイコン</summary><div class="controls"><div class="row"><button id="chooseIcon">画像を選択</button><button id="removeIcon">解除</button><input type="file" id="iconFile" accept="image/*" hidden></div><div class="grid2"><label>大きさ <output data-for="iconSize"></output><input id="iconSize" type="range" min="30" max="300" value="120"></label><label>間隔 <output data-for="iconGap"></output><input id="iconGap" type="range" min="0" max="100" value="24"></label></div></div></details>
</aside>
<section class="workspace"><div class="workspace-bar"><span>1920 × 1080</span><span>ドラッグで配置／ダブルクリックで直接編集</span></div><div class="stage-wrap"><div id="stage"><div id="safeGuide"><span>9:16 SAFE AREA</span></div><div id="telop" tabindex="0"><div id="telopBg"></div><div id="iconWrap"><img id="iconPreview"></div><div id="textStack"><div class="text-layer shadowLayer"></div><div class="text-layer outerLayer"></div><div class="text-layer innerLayer"></div><div class="text-layer fillLayer"></div></div></div></div></div></section></main>
<template id="colorTemplate"><label class="color-label"><span></span><div class="color-field"><input type="color"><input class="hex" maxlength="7"></div></label></template>
<script src="app.js"></script></body></html>
